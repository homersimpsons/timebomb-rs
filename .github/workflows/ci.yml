name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: ./client/package.json

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: ./client/pnpm-lock.yaml

      - name: "Server: cache cargo"
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./server

      - name: "Server: format check"
        working-directory: ./server
        run: cargo fmt -- --check

      - name: "Server: lint"
        working-directory: ./server
        run: cargo clippy -- -D warnings

      - name: "SpacetimeDB: install cache"
        id: cache-spacetimedb
        uses: actions/cache@v6
        with:
          path: .spacetimedb
          key: ${{ runner.os }}-spacetimedb

      - name: "SpacetimeDB: install"
        if: steps.cache-spacetimedb.outputs.cache-hit != 'true'
        run: curl -sSf https://install.spacetimedb.com | sh -s -- --yes --root-dir .spacetimedb

      - name: "SpacetimeDB: generate"
        # run: .spacetimedb/spacetime generate # @see https://github.com/clockworklabs/SpacetimeDB/issues/5993
        run: .spacetimedb/bin/current/spacetimedb-cli generate

      - name: "Client: install dependencies"
        working-directory: ./client
        run: pnpm install --frozen-lockfile

      - name: "Client: lint"
        working-directory: ./client
        run: pnpm run lint

      - name: "Client: typecheck"
        working-directory: ./client
        run: pnpm run typecheck

      - name: "Client: build"
        if: github.ref == 'refs/heads/main'
        working-directory: ./client
        run: pnpm run build
        env:
          NODE_ENV: production
          NITRO_PRESET: github_pages
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/
          NUXT_PUBLIC_SPACETIMEDB_HOST: ${{ vars.SPACETIMEDB_HOST }}
          NUXT_PUBLIC_SPACETIMEDB_DB_NAME: ${{ vars.SPACETIMEDB_DB_NAME }}

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./client/.output/public
          include-hidden-files: true

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # TODO
      # - name: "SpacetimeDB: publish"
      #   run: .spacetimedb/spacetime publish
      # Deployment job
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
